# workflow_actions.conf
#
# Pivot links from a Splunk alert into the Sycope NDR console for retrospective
# flow analysis (Workflow A, step "Pivot Link / Drilldown to Sycope GUI").
#
# -----------------------------------------------------------------------------
# Deep-link format (CONFIRMED against product):
#   https://<SYCOPE_HOST>/panel/alerts?source=alerts&gq=<URL-ENCODED-JSON>
#
# gq is a URL-encoded JSON:
#   {"query":{"source":"alerts","nql":"<NQL>","advanced":false},
#    "timerange":{"from":"<ISO8601>","to":"<ISO8601>","roundTo":"minute"}}
#
#   - NQL fields for the alerts source: clientIp / serverIp
#   - time format: ISO8601 with timezone offset, e.g. 2026-10-06T13:30:00+02:00
#
# The from/to values come from props.conf fields sycope_time_from /
# sycope_time_to, which build a +/-15 min window around the alert's _time
# in the required ISO8601 format. Two gotchas handled there: the tz offset
# gets a colon (+02:00, not +0200), and the leading "+" is pre-encoded as
# %2B because a raw "+" in a URL is decoded to a space by the browser.
#
# !!! BEFORE USE: replace SYCOPE_HOST with the customer's Sycope address.
#     (PoC instance seen so far: 172.16.60.27)
#
# Tokens: $src_ip$, $dest_ip$, $sycope_time_from$, $sycope_time_to$
#         (all confirmed/defined in props.conf for both sourcetypes).
# -----------------------------------------------------------------------------

[sycope_pivot_src_ip]
display_location = both
fields = src_ip
label = Sycope: investigate source IP $src_ip$
link.method = get
link.target = blank
link.uri = https://SYCOPE_HOST/panel/alerts?source=alerts&gq=%7B%22query%22%3A%7B%22source%22%3A%22alerts%22%2C%22nql%22%3A%22clientIp%20%3D%3D%20$src_ip$%20or%20serverIp%20%3D%3D%20$src_ip$%22%2C%22advanced%22%3Afalse%7D%2C%22timerange%22%3A%7B%22from%22%3A%22$sycope_time_from$%22%2C%22to%22%3A%22$sycope_time_to$%22%2C%22roundTo%22%3A%22minute%22%7D%7D
type = link

[sycope_pivot_dest_ip]
display_location = both
fields = dest_ip
label = Sycope: investigate destination IP $dest_ip$
link.method = get
link.target = blank
link.uri = https://SYCOPE_HOST/panel/alerts?source=alerts&gq=%7B%22query%22%3A%7B%22source%22%3A%22alerts%22%2C%22nql%22%3A%22clientIp%20%3D%3D%20$dest_ip$%20or%20serverIp%20%3D%3D%20$dest_ip$%22%2C%22advanced%22%3Afalse%7D%2C%22timerange%22%3A%7B%22from%22%3A%22$sycope_time_from$%22%2C%22to%22%3A%22$sycope_time_to$%22%2C%22roundTo%22%3A%22minute%22%7D%7D
type = link

[sycope_pivot_conversation]
display_location = event_menu
fields = src_ip, dest_ip
label = Sycope: investigate conversation $src_ip$ -> $dest_ip$
link.method = get
link.target = blank
link.uri = https://SYCOPE_HOST/panel/alerts?source=alerts&gq=%7B%22query%22%3A%7B%22source%22%3A%22alerts%22%2C%22nql%22%3A%22clientIp%20%3D%3D%20$src_ip$%20and%20serverIp%20%3D%3D%20$dest_ip$%22%2C%22advanced%22%3Afalse%7D%2C%22timerange%22%3A%7B%22from%22%3A%22$sycope_time_from$%22%2C%22to%22%3A%22$sycope_time_to$%22%2C%22roundTo%22%3A%22minute%22%7D%7D
type = link
