# workflow_actions.conf
#
# Pivot links from a Splunk alert into the Sycope NDR console for retrospective
# flow analysis (Workflow A, step "Pivot Link / Drilldown to Sycope GUI").
#
# -----------------------------------------------------------------------------
# Deep-link format (tested against Sycope 3.x):
#   https://<SYCOPE_HOST>/panel/alerts?source=alerts&gq=<URL-ENCODED-JSON>
#
# gq is a URL-encoded JSON:
#   {"query":{"source":"alerts","nql":"<FILTER>","advanced":false},
#    "timerange":{"from":"<ISO8601>","to":"<ISO8601>","roundTo":"minute"}}
#
#   - FILTER uses the same form the Sycope GUI builds for its own drilldowns:
#     eq(clientIp,"10.0.0.1") OR eq(serverIp,"10.0.0.1"). The GUI runs it as
#     src stream="alerts" | <FILTER>. IPs must be quoted: clientIp == 10.0.0.1
#     is rejected by Sycope (HTTP 400). Inside the JSON string the quotes are
#     escaped (\" -> %5C%22).
#   - time format: ISO8601 with timezone offset, e.g. 2026-10-06T13:30:00+02:00
#
# The from/to values come from props.conf fields sycope_time_from /
# sycope_time_to, which build a +/-15 min window around the alert's _time
# in the required ISO8601 format, with the tz offset written as +02:00 (not
# +0200). The "+" stays raw there: Splunk URI-encodes every inserted $field$
# value, so it reaches Sycope as %2B and decodes back to "+".
#
# !!! BEFORE USE: replace SYCOPE_HOST with the customer's Sycope address.
#
# Tokens: $src_ip$, $dest_ip$, $sycope_time_from$, $sycope_time_to$
#         (all defined in props.conf for both sourcetypes).
# -----------------------------------------------------------------------------

[sycope_pivot_src_ip]
display_location = both
fields = src_ip
label = Sycope: investigate source IP $src_ip$
link.method = get
link.target = blank
link.uri = https://SYCOPE_HOST/panel/alerts?source=alerts&gq=%7B%22query%22%3A%7B%22source%22%3A%22alerts%22%2C%22nql%22%3A%22eq%28clientIp%2C%5C%22$src_ip$%5C%22%29%20OR%20eq%28serverIp%2C%5C%22$src_ip$%5C%22%29%22%2C%22advanced%22%3Afalse%7D%2C%22timerange%22%3A%7B%22from%22%3A%22$sycope_time_from$%22%2C%22to%22%3A%22$sycope_time_to$%22%2C%22roundTo%22%3A%22minute%22%7D%7D
type = link

[sycope_pivot_dest_ip]
display_location = both
fields = dest_ip
label = Sycope: investigate destination IP $dest_ip$
link.method = get
link.target = blank
link.uri = https://SYCOPE_HOST/panel/alerts?source=alerts&gq=%7B%22query%22%3A%7B%22source%22%3A%22alerts%22%2C%22nql%22%3A%22eq%28clientIp%2C%5C%22$dest_ip$%5C%22%29%20OR%20eq%28serverIp%2C%5C%22$dest_ip$%5C%22%29%22%2C%22advanced%22%3Afalse%7D%2C%22timerange%22%3A%7B%22from%22%3A%22$sycope_time_from$%22%2C%22to%22%3A%22$sycope_time_to$%22%2C%22roundTo%22%3A%22minute%22%7D%7D
type = link

[sycope_pivot_conversation]
display_location = event_menu
fields = src_ip, dest_ip
label = Sycope: investigate conversation $src_ip$ -> $dest_ip$
link.method = get
link.target = blank
link.uri = https://SYCOPE_HOST/panel/alerts?source=alerts&gq=%7B%22query%22%3A%7B%22source%22%3A%22alerts%22%2C%22nql%22%3A%22eq%28clientIp%2C%5C%22$src_ip$%5C%22%29%20AND%20eq%28serverIp%2C%5C%22$dest_ip$%5C%22%29%22%2C%22advanced%22%3Afalse%7D%2C%22timerange%22%3A%7B%22from%22%3A%22$sycope_time_from$%22%2C%22to%22%3A%22$sycope_time_to$%22%2C%22roundTo%22%3A%22minute%22%7D%7D
type = link
