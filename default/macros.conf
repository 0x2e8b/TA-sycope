# =============================================================================
# TA-sycope - Search Macros
# =============================================================================
#
# The `sycope_index` macro is used by all dashboards to query Sycope data.
# It supports both sourcetypes so dashboards work regardless of which
# input method is configured.
#
# If you use only ONE sourcetype, you can optimize by editing this macro:
#   For CEF/Syslog only:  sourcetype="sycope:cef"
#   For JSON/HEC only:    sourcetype="sycope:json"
#
# If you use a custom index, add it here:
#   index=sycope sourcetype="sycope:cef"
# =============================================================================

[sycope_index]
definition = (sourcetype="sycope:cef" OR sourcetype="sycope:json")
iseval = 0
