# =============================================================================
# TA-sycope - Field Extraction Transforms for CEF/Syslog
# =============================================================================

# =============================================================================
# Index-time: Extract host from syslog header
# =============================================================================
# Sets Splunk's host metadata from the syslog hostname field
# Example: <14>Feb 10 13:27:30 sycope-os CEF:0|...
#          Host extracted: sycope-os
[sycope_cef_syslog_host]
DEST_KEY = MetaData:Host
REGEX = ^<\d+>\w+\s+\d+\s+[\d:]+\s+(\S+)\s+CEF:
FORMAT = host::$1

# =============================================================================
# Search-time: Syslog header fields
# =============================================================================
# Extracts syslog priority, timestamp, and hostname
[sycope_cef_syslog_fields]
REGEX = ^<(?<syslog_priority>\d+)>(?<syslog_timestamp>\w+\s+\d+\s+[\d:]+)\s+(?<cef_syslog_host>\S+)\s+CEF:

# =============================================================================
# Search-time: CEF header (7 pipe-delimited fields)
# =============================================================================
# Extracts: CEF:Version|Vendor|Product|DeviceVersion|DeviceEventClassID|Name|Severity|
#
# Example: CEF:0|Sycope|NPM|3.2.0|65da262c-...|Unauthorized LLMNR/NetBIOS Activity|5|
[sycope_cef_header]
REGEX = CEF:(?<cef_version>\d+)\|(?<cef_vendor>[^|]*)\|(?<cef_product>[^|]*)\|(?<cef_device_version>[^|]*)\|(?<cef_device_event_class_id>[^|]*)\|(?<cef_name>[^|]*)\|(?<cef_severity>[^|]*)\|

# =============================================================================
# Search-time: CEF extension key=value pairs
# =============================================================================
# The CEF extension section contains space-separated key=value pairs.
# Challenge: values can contain spaces (e.g., "Unauthorized LLMNR/NetBIOS Activity")
#
# Strategy: Match key=value where value extends until the next key= pattern or EOL.
# The negative lookahead (?![A-Za-z0-9_]+=) ensures spaces within values are captured
# but spaces before a new key= boundary terminate the value.
#
# MV_ADD=true enables Splunk to apply this regex repeatedly across all pairs.
[sycope_cef_extensions]
REGEX = (?:^|(?<=\|)|\s)([A-Za-z0-9_]+)=((?:[^\s=]|\s(?![A-Za-z0-9_]+=))*?)(?=\s+[A-Za-z0-9_]+=|\s*$)
FORMAT = $1::$2
MV_ADD = true

# =============================================================================
# Lookup definitions
# =============================================================================
[sycope_severity_lookup]
filename = sycope_severity_lookup.csv
case_sensitive_match = false

[sycope_protocol_lookup]
filename = sycope_protocol_lookup.csv

[sycope_mitre_tactics]
filename = sycope_mitre_tactics.csv

[sycope_mitre_techniques]
filename = sycope_mitre_techniques.csv

[sycope_alert_reference]
filename = sycope_alert_reference.csv
case_sensitive_match = false
