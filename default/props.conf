# =============================================================================
# TA-sycope - Sycope NPM Security Alerts
# Source Type Definitions and Field Extractions
# =============================================================================
#
# Two source types are defined:
#   sycope:cef  - CEF/Syslog format (received via syslog UDP/TCP)
#   sycope:json - JSON format (received via Splunk HTTP Event Collector)
#
# Users typically configure ONE of these, not both simultaneously.
# Both are normalized to a unified field namespace so dashboards work
# with either format.
# =============================================================================


# =============================================================================
# Source Type: sycope:cef (CEF/Syslog format)
# =============================================================================
[sycope:cef]
# --- Event Breaking ---
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 10000

# --- Timestamp ---
# Use syslog header timestamp
TIME_FORMAT = %b %d %H:%M:%S
TIME_PREFIX = ^<\d+>
MAX_TIMESTAMP_LOOKAHEAD = 20

# --- Disable auto KV (we use regex extractions) ---
KV_MODE = none

# --- Index-time: extract host from syslog header ---
TRANSFORMS-sycope_cef_syslog_host = sycope_cef_syslog_host

# --- Search-time field extractions ---
REPORT-sycope_cef_syslog_fields = sycope_cef_syslog_fields
REPORT-sycope_cef_header = sycope_cef_header
REPORT-sycope_cef_extensions = sycope_cef_extensions

# --- Override _time with rt field (epoch millis, more accurate) ---
EVAL-_time = if(isnotnull(rt), rt/1000, _time)

# --- CIM: Intrusion Detection fields ---
EVAL-action = "allowed"
EVAL-ids_type = "network"
EVAL-vendor_product = "Sycope NPM"
EVAL-signature = coalesce(SycopeNPMAlertName, cef_name)
EVAL-signature_id = coalesce(SycopeNPMAlertRuleId, cef_device_event_class_id)
EVAL-severity = lower(SycopeNPMAlertSeverity)
EVAL-severity_id = cef_severity
EVAL-category = cat
EVAL-rule_type = upper(cat)
EVAL-dest = dst
EVAL-dest_ip = dst
EVAL-dest_port = dpt
EVAL-src_ip = src
EVAL-dvc = cef_syslog_host
EVAL-transport = case(SycopeNPMProtocolName=="6","tcp", SycopeNPMProtocolName=="17","udp", SycopeNPMProtocolName=="1","icmp", isnotnull(SycopeNPMProtocolName), SycopeNPMProtocolName, 1==1, "unknown")

# --- CIM: Network Traffic fields ---
EVAL-bytes_in = in
EVAL-bytes_out = out
EVAL-bytes = in + out
EVAL-packets = cnt

# --- MITRE ATT&CK unified fields ---
EVAL-mitre_tactic = SycopeNPMAlertMitreTactic
EVAL-mitre_technique = SycopeNPMAlertMitreTechnique
EVAL-mitre_technique_id = SycopeNPMAlertMitreId

# --- Sycope unified namespace ---
EVAL-alert_id = externalId
EVAL-alert_definition_id = coalesce(SycopeNPMAlertDefId, cef_device_event_class_id)
EVAL-alert_name = coalesce(SycopeNPMAlertName, cef_name)
EVAL-alert_severity = SycopeNPMAlertSeverity
EVAL-alert_rule_id = SycopeNPMAlertRuleId
EVAL-alert_threshold_level = SycopeNPMAlertFlagThresholdLevel
EVAL-alert_tags = SycopeNPMAlertTags
EVAL-sum_bytes = SycopeNPMSumBytes

# --- Sycope deep-link time window (ISO8601 +/- 15 min around the alert) ---
# Sycope expects +02:00; strftime %z yields +0200, so insert the colon. The
# values go straight into a URL, so the leading +/- must be URL-encoded
# (%2B / %2D) - a raw "+" would be read as a space by the browser.
EVAL-sycope_tz = replace(replace(replace(strftime(_time,"%z"), "(\d\d)(\d\d)$", "\1:\2"), "^\+", "%2B"), "^-", "%2D")
EVAL-sycope_time_from = strftime(_time-900,"%Y-%m-%dT%H:%M:%S") . sycope_tz
EVAL-sycope_time_to   = strftime(_time+900,"%Y-%m-%dT%H:%M:%S") . sycope_tz

# --- Lookups ---
LOOKUP-severity_lookup = sycope_severity_lookup severity_original AS SycopeNPMAlertSeverity OUTPUT severity_normalized, severity_weight
LOOKUP-protocol_lookup = sycope_protocol_lookup protocol_number AS SycopeNPMProtocolName OUTPUT protocol_name
LOOKUP-alert_reference = sycope_alert_reference alert_name OUTPUT rule_id AS alert_ref_rule_id, rule_type, mitre_tactic AS mitre_tactic_ref, mitre_technique AS mitre_technique_ref, mitre_technique_id AS mitre_technique_id_ref, mitre_subtechnique AS mitre_subtechnique, default_severity, default_score
LOOKUP-mitre_techniques = sycope_mitre_techniques mitre_technique_id OUTPUT tactic_id AS mitre_tactic_id


# =============================================================================
# Source Type: sycope:json (JSON/HEC format)
# =============================================================================
[sycope:json]
# --- Event Breaking ---
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)\{
NO_BINARY_CHECK = true
TRUNCATE = 50000

# --- Timestamp ---
# Use unixTimestamp field (epoch millis)
TIME_FORMAT = %s%3N
TIME_PREFIX = "unixTimestamp"\s*:\s*
MAX_TIMESTAMP_LOOKAHEAD = 16

# --- JSON auto-extraction ---
KV_MODE = json

# --- Override _time from epoch millis ---
EVAL-_time = if(isnotnull(unixTimestamp), unixTimestamp/1000, _time)

# --- CIM: Intrusion Detection fields ---
EVAL-action = "allowed"
EVAL-ids_type = "network"
EVAL-vendor_product = "Sycope NPM"
EVAL-signature = name
EVAL-signature_id = ruleId
EVAL-severity = lower(severity)
EVAL-severity_id = score
EVAL-category = ruleType
EVAL-dvc = "sycope-npm"
EVAL-dest_port = serverPort

# --- Nested IP object resolution ---
# Splunk KV_MODE=json produces serverIp.addressString, clientIp.addressString
# Single quotes required for dot-notation field names in EVAL
EVAL-dest = coalesce('serverIp.addressString', serverIp)
EVAL-dest_ip = coalesce('serverIp.addressString', serverIp)
EVAL-src = coalesce('clientIp.addressString', clientIps)
EVAL-src_ip = coalesce('clientIp.addressString', clientIps)

# --- MITRE ATT&CK unified fields ---
EVAL-mitre_tactic = mitreTactic
EVAL-mitre_technique = mitreTechnique
EVAL-mitre_technique_id = mitreId
EVAL-mitre_subtechnique = mitreSubtechnique

# --- Sycope unified namespace ---
EVAL-alert_id = id
EVAL-alert_definition_id = definitionId
EVAL-alert_name = name
EVAL-alert_severity = severity
EVAL-alert_rule_id = ruleId
EVAL-alert_threshold_level = alertFlagThresholdLevel
EVAL-alert_score = score
EVAL-alert_tags = mvjoin(tags, ";")
EVAL-session_count = '_countSessions'
EVAL-unique_client_ips = '_uniqueClientIPs'
EVAL-transport = case(protocolName==6,"tcp", protocolName==17,"udp", protocolName==1,"icmp", isnotnull(protocolName), protocolName, 1==1, "unknown")

# --- Country fields for geographic analysis ---
FIELDALIAS-server_country = serverCountry AS dest_country
FIELDALIAS-client_country = clientCountry AS src_country

# --- Rule type ---
EVAL-rule_type = upper(coalesce(ruleType, "SECURITY"))

# --- Sycope deep-link time window (ISO8601 +/- 15 min around the alert) ---
# Sycope expects +02:00; strftime %z yields +0200, so insert the colon. The
# values go straight into a URL, so the leading +/- must be URL-encoded
# (%2B / %2D) - a raw "+" would be read as a space by the browser.
EVAL-sycope_tz = replace(replace(replace(strftime(_time,"%z"), "(\d\d)(\d\d)$", "\1:\2"), "^\+", "%2B"), "^-", "%2D")
EVAL-sycope_time_from = strftime(_time-900,"%Y-%m-%dT%H:%M:%S") . sycope_tz
EVAL-sycope_time_to   = strftime(_time+900,"%Y-%m-%dT%H:%M:%S") . sycope_tz

# --- Lookups ---
LOOKUP-severity_lookup = sycope_severity_lookup severity_original AS severity OUTPUT severity_normalized, severity_weight
LOOKUP-alert_reference = sycope_alert_reference alert_name OUTPUT rule_id AS alert_ref_rule_id, rule_type AS rule_type_ref, default_severity, default_score
LOOKUP-mitre_techniques = sycope_mitre_techniques mitre_technique_id OUTPUT tactic_id AS mitre_tactic_id
