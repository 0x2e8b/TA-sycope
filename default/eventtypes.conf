# =============================================================================
# TA-sycope - Event Types for CIM Data Model Compliance
# =============================================================================

[sycope_ids_alert]
search = (sourcetype="sycope:cef" OR sourcetype="sycope:json")

[sycope_network_traffic]
search = sourcetype="sycope:cef" src=* dst=*

[sycope_mitre_event]
search = (sourcetype="sycope:cef" SycopeNPMAlertMitreId=*) OR (sourcetype="sycope:json" mitreId=*)

# --- Rule type event types ---
[sycope_security_alert]
search = (sourcetype="sycope:cef" OR sourcetype="sycope:json") rule_type="SECURITY"

[sycope_performance_alert]
search = (sourcetype="sycope:cef" OR sourcetype="sycope:json") rule_type="PERFORMANCE"

[sycope_visibility_alert]
search = (sourcetype="sycope:cef" OR sourcetype="sycope:json") rule_type="VISIBILITY"
