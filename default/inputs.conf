# =============================================================================
# TA-sycope - Input Configuration
# =============================================================================
#
# Users configure ONE of the following input methods:
#
# OPTION A: CEF/Syslog
#   Enable the UDP or TCP listener below. Port 514 is used by default.
#   Configure Sycope NPM to send CEF syslog to this port.
#
# OPTION B: JSON via HTTP Event Collector (HEC)
#   HEC is configured at the Splunk server level:
#   1. Settings > Data Inputs > HTTP Event Collector > Global Settings > Enable
#   2. Create new HEC token with sourcetype: sycope:json
#   3. Configure Sycope NPM REST client to POST to:
#      https://<splunk_host>:8088/services/collector/raw?sourcetype=sycope:json
#      with header: Authorization: Splunk <token>
#   Note: Use /services/collector/raw (not /event) because Sycope sends
#   raw JSON without the {"event":...} wrapper that /event requires.
# =============================================================================

# --- Syslog UDP listener (disabled by default) ---
[udp://514]
disabled = true
sourcetype = sycope:cef
connection_host = dns
index = main
no_appending_timestamp = true

# --- Syslog TCP listener (disabled by default) ---
[tcp://514]
disabled = true
sourcetype = sycope:cef
connection_host = dns
index = main
